<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record with script</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:#1F5EFF}a:hover{color:#1747C8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B3038; color: #0B1220; font-family: Inter, system-ui, sans-serif; position: relative; display: flex; flex-direction: column">

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="230" height="330" viewBox="0 0 230 330" fill="#3A404A"><circle cx="115" cy="95" r="62"/><path d="M0 330c0-80 50-140 115-140s115 60 115 140z"/></svg>
</div>

<div style="position: relative; padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); color: #0B1220; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<div style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
<span style="color: #1F5EFF">60 fps</span><span style="color: #566074">1080p</span>
</div>
<button aria-label="Script speed and size" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.9); color: #0B1220; font-weight: 600; font-size: 15px">Aa</button>
</div>

<div style="position: relative; margin: 16px 20px 0; padding: 18px; border-radius: 20px; background: rgba(255,255,255,0.92); box-shadow: 0 12px 32px rgba(0,0,0,0.25); display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 600; color: #1F5EFF; letter-spacing: 0.4px">LINE 3 OF 6</div>
<div style="font-weight: 600; font-size: 26px; line-height: 1.25; letter-spacing: -0.5px">Here's what nobody tells you about it.</div>
<div style="font-size: 17px; line-height: 1.35; color: #566074">Next: It takes ten seconds and it actually works.</div>
</div>

<div style="flex-grow: 1"></div>

<div style="position: relative; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 5px">
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #1F5EFF"></div>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #1F5EFF"></div>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #0B1220"></div>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #D5DDEA"></div>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #D5DDEA"></div>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #D5DDEA"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #566074">
<div>2 lines kept</div>
<div>Take 2 of this line</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<button style="width: 96px; min-height: 64px; border-radius: 20px; border: 1px solid rgba(12,24,48,0.14); background: #FFFFFF; color: #B4441E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete take</button>

<button aria-label="Record this line" style="width: 84px; height: 84px; border-radius: 42px; border: 4px solid #0B1220; background: transparent; padding: 6px; display: flex"><span style="flex-grow: 1; border-radius: 40px; background: #F0442E"></span></button>

<button style="width: 96px; min-height: 64px; border-radius: 20px; border: 0; background: linear-gradient(180deg, #2A66FF 0%, #1A52E8 100%); box-shadow: 0 8px 20px rgba(31,94,255,0.28), inset 0 1px 0 rgba(255,255,255,0.35); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Keep, next</button>
</div>

<a href="Review.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #0B1220; text-decoration: none">Finish and edit</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
